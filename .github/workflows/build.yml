name: Docker (API)

# The image ships its data: data/ is a COPY source of Dockerfile.production, so
# a data bump (the "dso data X → Y" pull request) publishes a new :main-prod.
# Every COPY source is in both paths: lists (tests/test_build_workflow_paths.py).

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'Dockerfile.production'
      - 'main.py'
      - 'api/**'
      - 'core/**'
      - 'shared/**'
      - 'locales/**'
      - 'data/**'
      - 'requirements/base.txt'
      - 'requirements/api.txt'
      - '.dockerignore'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile.production'
      - 'main.py'
      - 'api/**'
      - 'core/**'
      - 'shared/**'
      - 'locales/**'
      - 'data/**'
      - 'requirements/base.txt'
      - 'requirements/api.txt'
      - '.dockerignore'
      - '.github/workflows/build.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The data release baked into the image, as an image label
      # (`docker inspect` answers "which data is production serving?").
      - name: Read the data version
        id: data
        run: |
          version=$(python3 -c "import json; print(json.load(open('data/release.json', encoding='utf-8'))['version'])")
          case "$version" in
            *-draft)
              echo "::error::data/ holds the draft ${version}; only a published release may be built"
              exit 1
              ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-prod,onlatest=true
          labels: |
            optimce.dso.data-version=${{ steps.data.outputs.version }}

      - name: Build and push (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod
