name: Test

# No service container: dso-lookup has no database and no broker. The suite
# runs every vector of data/vectors.csv through HTTP, and under CI (CI=true,
# set by GitHub Actions) tests/test_ci_guard.py refuses draft data.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/testing.txt

      - run: pip install -r requirements/testing.txt

      - run: pytest
