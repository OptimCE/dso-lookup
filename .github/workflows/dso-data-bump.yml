name: DSO data bump

# When belgian-dso-map has published a newer release, pin it into data/ with
# scripts/sync_data.py and open the pull request "dso data X → Y". Merging it
# publishes :main-prod (build.yml watches data/**). Up to date, or an OLDER
# "latest": the job ends green and opens nothing (--if-newer).
#
# ===========================================================================
# THREE TRIGGERS, BECAUSE THE CRON ALONE GOES QUIET.
#
# GitHub disables the scheduled workflows of a PUBLIC repository after 60 days
# without activity, and says so only by email: no check goes red. A data
# release comes about every six months and an up-to-date run commits nothing,
# so the cron alone would be off before the next release.
#   - repository_dispatch `dso-data-released`: belgian-dso-map's release.yml
#     sends it after publishing (client_payload.version = the tag) when its
#     DSO_CONSUMERS_TOKEN secret is set. It is not subject to the 60-day rule.
#     When release.yml could not send it (no secret, or a failed dispatch: its
#     notice or warning says so), run this workflow by hand (Actions -> DSO
#     data bump -> Run workflow), re-enabling it there first if GitHub
#     disabled it.
#   - schedule (Mondays 06:00 UTC): the safety net while it is enabled.
#   - workflow_dispatch: by hand. A `version` given there is pinned even when
#     it is older than data/ (a deliberate rollback).
# ===========================================================================
#
# ===========================================================================
# WHY A PERSONAL ACCESS TOKEN, NOT GITHUB_TOKEN.
#
# A pull request opened (or a branch pushed) with the automatic GITHUB_TOKEN
# triggers NO workflow: test.yml would never run the new release's vectors on
# it, and the PR would look green for having been checked by nothing.
#
# Secret DSO_DATA_BOT_TOKEN: a fine-grained PAT (or a GitHub App token) with
#   - OptimCE/dso-lookup: Contents read/write      (push the dso-data/ branch)
#                         Pull requests read/write (open the PR)
#
# READING THE RELEASE NEEDS NO SECRET. belgian-dso-map is public (its data
# CC BY 4.0): sync_data.py reads its releases anonymously when DSO_MAP_TOKEN
# is unset or empty, and the PAT needs nothing on that repository. The sync
# step passes this run's own automatic github.token as DSO_MAP_TOKEN only to
# lift the anonymous API rate limit (60 requests an hour per IP, which hosted
# runners share; a sync makes about ten). sync_data.py sends it with
# add_unredirected_header (never to the signed storage URL the assets
# redirect to) and never prints it.
# ===========================================================================

on:
  repository_dispatch:
    types: [dso-data-released]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "Release to pin (YYYY.MM.N), even an older one. Empty = the latest, if newer."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: dso-data-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      # The PAT pushes the branch and opens the pull request (so that test.yml
      # runs on it); reading the release does not use it.
      - name: Check the token
        env:
          DSO_DATA_BOT_TOKEN: ${{ secrets.DSO_DATA_BOT_TOKEN }}
        run: |
          if [ -z "${DSO_DATA_BOT_TOKEN}" ]; then
            echo "::error::DSO_DATA_BOT_TOKEN is not set (see the header of this workflow)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DSO_DATA_BOT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only: no pip install. A draft is refused (no
      # --from-dir here), the SHA256SUMS rule and the whole contract are checked,
      # and data/ is replaced all or nothing. --if-newer: an older or equal
      # release is "up to date" (changed=false), never a downgrade pull request.
      # The versions reach the script through env, never its text; sync_data.py
      # refuses anything that is not YYYY.MM.N. DSO_MAP_TOKEN is optional (the
      # data repository is public): the automatic token, never a secret.
      - name: Sync the release
        id: sync
        env:
          DSO_MAP_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.version }}
          RELEASED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [ -n "${MANUAL_VERSION}" ]; then
            args=(--version "${MANUAL_VERSION}") # by hand: may roll back, on purpose
          elif [ -n "${RELEASED_VERSION}" ]; then
            args=(--version "${RELEASED_VERSION}" --if-newer)
          else
            args=(--latest --if-newer)
          fi
          python scripts/sync_data.py "${args[@]}" \
            --pr-body "${RUNNER_TEMP}/pr-body.md" --github-output

      - name: Open the pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DSO_DATA_BOT_TOKEN }}
          FROM: ${{ steps.sync.outputs.from }}
          TO: ${{ steps.sync.outputs.to }}
        run: |
          branch="dso-data/${TO}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null; then
            echo "${branch} already exists: its pull request is open, or was closed on purpose."
            exit 0
          fi
          title="dso data ${FROM:-none} → ${TO}"
          git config user.name "dso-data-bot"
          git config user.email "dso-data-bot@users.noreply.github.com"
          git checkout -b "${branch}"
          git add data/ ATTRIBUTION.md
          git commit -m "chore(data): ${title}" -m "Pinned with scripts/sync_data.py."
          git push origin "${branch}"
          gh pr create --base main --head "${branch}" --title "${title}" \
            --body-file "${RUNNER_TEMP}/pr-body.md"
